<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skillshot Duel</title>
<style>
  :root { --gold: #f2c45a; --blue: #4fb3ff; --bg: #0b1018; --panel: rgba(12,18,28,.92); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #e8eef6; font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5,8,14,.72); z-index: 5; }
  .hidden { display: none !important; }
  .panel { background: var(--panel); border: 1px solid #2a3a52; border-radius: 14px; padding: 28px 32px; width: min(440px, 92vw); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: 2px; color: var(--gold); text-shadow: 0 0 18px rgba(242,196,90,.4); }
  .sub { color: #9fb0c6; margin: 0 0 22px; font-size: 14px; }
  .section { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #7c8da5; }
  button { font: inherit; font-weight: 600; background: linear-gradient(#1e3552, #16273d); color: #e8eef6; border: 1px solid #36557c; border-radius: 8px; padding: 10px 14px; cursor: pointer; transition: .12s; }
  button:hover { border-color: var(--gold); color: var(--gold); }
  button.primary { background: linear-gradient(#c9973a, #9c7020); border-color: #f2c45a; color: #1a1205; }
  button.primary:hover { color: #000; filter: brightness(1.1); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  input { font: inherit; text-transform: uppercase; letter-spacing: 4px; text-align: center; background: #0d1622; color: #fff; border: 1px solid #36557c; border-radius: 8px; padding: 10px; min-width: 0; }
  .controls { margin-top: 20px; font-size: 13px; color: #9fb0c6; line-height: 1.7; text-align: left; background: #0d1622; border-radius: 8px; padding: 10px 14px; }
  kbd { background: #1c2a3d; border: 1px solid #36557c; border-radius: 4px; padding: 0 6px; font-size: 12px; color: #fff; }
  .msg { color: var(--gold); min-height: 20px; margin-top: 12px; font-size: 14px; }
  .big { font-size: 40px; letter-spacing: 6px; color: var(--gold); margin: 10px 0; font-weight: 700; user-select: all; cursor: text; }
  .invite { margin: 4px 0 16px; }
  .invite input { width: 100%; letter-spacing: 0; text-transform: none; font-size: 13px; user-select: all; margin-bottom: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>SKILLSHOT DUEL</h1>
    <p class="sub">1v1 Mystic Shot dodgeball &middot; 5 lives &middot; best of 3</p>

    <div class="section">Solo vs Bot</div>
    <div class="row">
      <button data-bot="easy">Easy</button>
      <button data-bot="normal">Normal</button>
      <button data-bot="hard">Hard</button>
    </div>

    <div class="section">Online</div>
    <button id="quick" class="primary" style="width:100%">Quick Match</button>
    <div class="row" style="margin-top:8px">
      <button id="create">Create Private</button>
      <input id="code" placeholder="CODE">
      <button id="join" style="flex:.6">Join</button>
    </div>
    <div id="menuMsg" class="msg"></div>

    <div class="controls">
      <kbd>Right-click</kbd> move (hold to keep moving) &nbsp; <kbd>S</kbd> stop<br>
      <kbd>Q</kbd> Mystic Shot toward cursor<br>
      <kbd>E</kbd> Arcane Shift — blink toward cursor<br>
      <kbd>Esc</kbd> leave match
    </div>
  </div>
</div>

<div id="wait" class="overlay hidden">
  <div class="panel">
    <h1 id="waitTitle">Waiting…</h1>
    <div id="waitCode" class="big"></div>
    <p class="sub" id="waitSub"></p>
    <div id="invite" class="invite hidden">
      <input id="inviteLink" readonly>
      <div class="row">
        <button id="copyCode">Copy code</button>
        <button id="copyLink" class="primary">Copy invite link</button>
      </div>
    </div>
    <button id="cancel">Cancel</button>
  </div>
</div>

<div id="end" class="overlay hidden" style="background:rgba(5,8,14,.45)">
  <div class="panel">
    <h1 id="endTitle">Victory</h1>
    <p class="sub" id="endSub"></p>
    <div class="row">
      <button id="rematch" class="primary">Rematch</button>
      <button id="toMenu">Main Menu</button>
    </div>
    <div id="endMsg" class="msg"></div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="sim.js"></script>
<script src="bot.js"></script>
<script src="host.js"></script>
<script src="game.js"></script>
</body>
</html>
